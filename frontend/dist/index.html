    <!-- Applique le thème mémorisé avant le premier rendu (évite un flash) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("aria-theme");
          /* Thème par défaut : mode clair (sauf choix explicite "dark") */
          var isLight = stored !== "dark";
          if (isLight) document.documentElement.classList.add("light");
          document.documentElement.style.colorScheme = isLight ? "light" : "dark";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", isLight ? "#f7f5f2" : "#1a1715");
        } catch (e) {}
      })();
    </script>
